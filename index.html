<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Scan Global Logistics</title>
  <link rel="preload" href="assets/fonts/segoe-pro-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20261028h">
</head>
<body data-page="login" class="login-page">
  <main class="login-card">
    <img class="login-logo" src="assets/images/logo.svg" alt="Scan Global Logistics">
    <h1>Login</h1>
    <form id="login-form">
      <label class="sr-only" for="username">Username</label>
      <input id="username" type="text" placeholder="Username..." autocomplete="username" required>
      <label class="sr-only" for="password">Password</label>
      <input id="password" type="password" placeholder="Password..." autocomplete="current-password" required>
      <div class="login-row">
        <label class="check"><input type="checkbox"> Stay signed in</label>
        <button class="btn btn-red" type="submit">LOGIN</button>
      </div>
    </form>
    <p class="forgot">Forgotten password? <a href="#">Click here</a></p>
  </main>
  <script src="i18n.js?v=20261028h"></script>
  <script src="script.js?v=20261028h"></script>
</body>
</html>
